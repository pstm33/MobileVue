# TAGAM production PWA routing snippet.
# Insert inside the HTTPS server block for tagam.delivery before the generic `location /`.
# Keep the existing FastPanel/PHP proxy locations for Tagam backend paths.

set $pwa_root /var/www/fastuser/data/www/pwa.tagam.delivery;

location = /index.html {
    root $pwa_root;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
}

location = /manifest.webmanifest {
    root $pwa_root;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location = /robots.txt {
    root $pwa_root;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location = /sitemap.xml {
    root $pwa_root;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location = /firebase-messaging-sw.js {
    root $pwa_root;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
}

location ^~ /pwa-assets/ {
    root $pwa_root;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ^~ /icons/ {
    root $pwa_root;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ~ ^/(home|search|restaurant|cart|checkout|orders|order|tracking|account|profile|addresses|payments|favourites|offers|categories|wallet|points|booking|notifications|legal|privacy-policy|terms-of-service|data-deletion)(/.*)?$ {
    root $pwa_root;
    try_files $uri $uri/ /index.html;
}

location = / {
    root $pwa_root;
    try_files /index.html =404;
}
